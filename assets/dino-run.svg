<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Pixel-art dinosaur running across a retro desert landscape">
  <title>Pixel Dino Run</title>

  <style>
    /* rects use fill="currentColor", so flip `color` to recolor the scene */
    svg  { color:#535353; --bg:#ffffff; }
    .dim { opacity:0.35; }
    @media (prefers-color-scheme: dark) {
      svg  { color:#e9e9e9; --bg:#0d1117; }
      .dim { opacity:0.4; }
    }
  </style>

  <!-- ================= SUN (static, top right) ================= -->
  <g class="fg" opacity="0.9">
    <rect x="760" y="48" width="24" height="8"  fill="currentColor"/>
    <rect x="744" y="56" width="8"  height="8"  fill="currentColor"/>
    <rect x="752" y="56" width="40" height="24" fill="currentColor"/>
    <rect x="792" y="56" width="8"  height="8"  fill="currentColor"/>
    <rect x="744" y="64" width="64" height="16" fill="currentColor"/>
    <rect x="744" y="80" width="8"  height="8"  fill="currentColor"/>
    <rect x="792" y="80" width="8"  height="8"  fill="currentColor"/>
    <rect x="760" y="88" width="24" height="8"  fill="currentColor"/>
  </g>

  <!-- ================= CLOUDS (slow scroll) ================= -->
  <g class="fg" opacity="0.45">
    <g>
      <rect x="0" y="70" width="56" height="8" fill="currentColor"/>
      <rect x="8" y="62" width="32" height="8" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-904 0" dur="70s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="120" width="40" height="8" fill="currentColor"/>
      <rect x="8" y="112" width="24" height="8" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="452 0" to="-452 0" dur="95s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="40" width="48" height="8" fill="currentColor"/>
      <rect x="8" y="32" width="32" height="8" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="678 0" to="-226 0" dur="110s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================= BACKGROUND CACTI (dim, pass behind the dino) ================= -->
  <g class="dim">
    <g>
      <rect x="0"  y="216" width="8" height="72" fill="currentColor"/>
      <rect x="-8" y="248" width="8" height="16" fill="currentColor"/><rect x="-8" y="248" width="16" height="8" fill="currentColor"/>
      <rect x="-8" y="264" width="8" height="8"  fill="currentColor"/>
      <rect x="8"  y="240" width="8" height="16" fill="currentColor"/><rect x="8"  y="240" width="16" height="8" fill="currentColor"/>
      <rect x="16" y="248" width="8" height="8"  fill="currentColor"/>
      <rect x="56" y="248" width="8" height="40" fill="currentColor"/>
      <rect x="48" y="264" width="8" height="8"  fill="currentColor"/>
      <rect x="48" y="272" width="8" height="8"  fill="currentColor"/>
      <rect x="64" y="256" width="8" height="8"  fill="currentColor"/>
      <rect x="64" y="264" width="8" height="8"  fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-450 0" dur="4.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(450 0)">
      <rect x="0"  y="216" width="8" height="72" fill="currentColor"/>
      <rect x="-8" y="248" width="8" height="16" fill="currentColor"/><rect x="-8" y="248" width="16" height="8" fill="currentColor"/>
      <rect x="-8" y="264" width="8" height="8"  fill="currentColor"/>
      <rect x="8"  y="240" width="8" height="16" fill="currentColor"/><rect x="8"  y="240" width="16" height="8" fill="currentColor"/>
      <rect x="16" y="248" width="8" height="8"  fill="currentColor"/>
      <rect x="56" y="248" width="8" height="40" fill="currentColor"/>
      <rect x="48" y="264" width="8" height="8"  fill="currentColor"/>
      <rect x="48" y="272" width="8" height="8"  fill="currentColor"/>
      <rect x="64" y="256" width="8" height="8"  fill="currentColor"/>
      <rect x="64" y="264" width="8" height="8"  fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="450 0" to="0 0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================= GROUND (scrolling dashes + pebbles) ================= -->
  <g class="fg">
    <g>
      <rect x="0"   y="288" width="112" height="2" fill="currentColor"/>
      <rect x="128" y="288" width="48"  height="2" fill="currentColor"/>
      <rect x="192" y="288" width="160" height="2" fill="currentColor"/>
      <rect x="368" y="288" width="32"  height="2" fill="currentColor"/>
      <rect x="416" y="288" width="144" height="2" fill="currentColor"/>
      <rect x="576" y="288" width="80"  height="2" fill="currentColor"/>
      <rect x="672" y="288" width="176" height="2" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-160 0" dur="0.90s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(160 0)">
      <rect x="0"   y="288" width="112" height="2" fill="currentColor"/>
      <rect x="128" y="288" width="48"  height="2" fill="currentColor"/>
      <rect x="192" y="288" width="160" height="2" fill="currentColor"/>
      <rect x="368" y="288" width="32"  height="2" fill="currentColor"/>
      <rect x="416" y="288" width="144" height="2" fill="currentColor"/>
      <rect x="576" y="288" width="80"  height="2" fill="currentColor"/>
      <rect x="672" y="288" width="176" height="2" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="160 0" to="0 0" dur="0.90s" repeatCount="indefinite"/>
    </g>
  </g>
  <g class="dim">
    <g>
      <rect x="0"   y="298" width="8" height="4" fill="currentColor"/>
      <rect x="56"  y="306" width="8" height="4" fill="currentColor"/>
      <rect x="128" y="300" width="8" height="4" fill="currentColor"/>
      <rect x="200" y="308" width="8" height="4" fill="currentColor"/>
      <rect x="280" y="298" width="8" height="4" fill="currentColor"/>
      <rect x="344" y="304" width="8" height="4" fill="currentColor"/>
      <rect x="408" y="296" width="8" height="4" fill="currentColor"/>
      <rect x="472" y="306" width="8" height="4" fill="currentColor"/>
      <rect x="544" y="300" width="8" height="4" fill="currentColor"/>
      <rect x="616" y="306" width="8" height="4" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-120 0" dur="0.85s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(120 0)">
      <rect x="0"   y="298" width="8" height="4" fill="currentColor"/>
      <rect x="56"  y="306" width="8" height="4" fill="currentColor"/>
      <rect x="128" y="300" width="8" height="4" fill="currentColor"/>
      <rect x="200" y="308" width="8" height="4" fill="currentColor"/>
      <rect x="280" y="298" width="8" height="4" fill="currentColor"/>
      <rect x="344" y="304" width="8" height="4" fill="currentColor"/>
      <rect x="408" y="296" width="8" height="4" fill="currentColor"/>
      <rect x="472" y="306" width="8" height="4" fill="currentColor"/>
      <rect x="544" y="300" width="8" height="4" fill="currentColor"/>
      <rect x="616" y="306" width="8" height="4" fill="currentColor"/>
      <animateTransform attributeName="transform" type="translate"
        from="120 0" to="0 0" dur="0.85s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================= DINO (running, feet ON the ground at y=288) ================= -->
  <g class="dino">
    <!-- tail -->
    <rect x="176" y="214" width="24" height="8"  fill="currentColor"/>
    <rect x="168" y="222" width="16" height="8"  fill="currentColor"/>
    <!-- body -->
    <rect x="192" y="198" width="88" height="48" fill="currentColor"/>
    <!-- neck -->
    <rect x="272" y="166" width="24" height="40" fill="currentColor"/>
    <!-- head -->
    <rect x="280" y="150" width="72" height="32" fill="currentColor"/>
    <!-- snout -->
    <rect x="344" y="166" width="8"  height="16" fill="currentColor"/>
    <!-- mouth line (background-colored notch) -->
    <rect x="336" y="174" width="8"  height="2"  fill="var(--bg)"/>
    <!-- eye + blink (scoped to the eye only) -->
    <g>
      <rect x="320" y="158" width="8" height="8" fill="#ffffff"/>
      <rect x="322" y="160" width="4" height="4" fill="#535353"/>
      <animate attributeName="display" values="inline;inline;none;inline;inline" keyTimes="0;0.9;0.92;0.94;1" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <!-- tiny arm -->
    <rect x="288" y="230" width="8"  height="16" fill="currentColor"/>

    <!-- ===== LEGS : alternating run cycle, feet land on ground (y=288) ===== -->
    <g>
      <!-- frame A : front leg planted, back leg kicked up -->
      <g>
        <rect x="204" y="246" width="16" height="30" fill="currentColor"/>
        <rect x="204" y="276" width="28" height="12" fill="currentColor"/>
        <rect x="264" y="246" width="16" height="22" fill="currentColor"/>
        <rect x="272" y="268" width="24" height="12" fill="currentColor"/>
      </g>
      <animate attributeName="display" values="inline;none" keyTimes="0;0.5" dur="0.24s" repeatCount="indefinite"/>
    </g>
    <g>
      <!-- frame B : front leg kicked up, back leg planted -->
      <g>
        <rect x="204" y="246" width="16" height="22" fill="currentColor"/>
        <rect x="196" y="268" width="24" height="12" fill="currentColor"/>
        <rect x="264" y="246" width="16" height="30" fill="currentColor"/>
        <rect x="264" y="276" width="28" height="12" fill="currentColor"/>
      </g>
      <animate attributeName="display" values="none;inline" keyTimes="0;0.5" dur="0.24s" repeatCount="indefinite"/>
    </g>

    <!-- dust puffs behind the feet -->
    <g class="dim">
      <rect x="176" y="278" width="8" height="4" fill="currentColor">
        <animate attributeName="opacity" values="0.7;0" dur="0.24s" repeatCount="indefinite"/>
      </rect>
      <rect x="160" y="284" width="8" height="4" fill="currentColor">
        <animate attributeName="opacity" values="0;0.7;0" dur="0.36s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
